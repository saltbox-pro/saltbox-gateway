---

stages:
  - lint
  - build

variables:
  # Set 0 to disable linting jobs
  LINTING_ENABLED: true

include:
  - project: 'saltbox/ci-lib'
    file: 'build-image.yml'


Build core image for tag:
  stage: build
  extends: .build-image
  variables:
    TARGET: main
    IMAGE_TAG: '$CI_COMMIT_TAG'
  rules:
    - if: '$CI_COMMIT_TAG'


Build core image for branch:
  stage: build
  extends: .build-image
  variables:
    TARGET: main
    IMAGE_TAG: '$CI_COMMIT_BRANCH'
  rules:
    - if: '$CI_COMMIT_BRANCH'

ruff:
  stage: lint
  variables:
    PIP_CACHE_DIR: '$CI_PROJECT_DIR/.cache/pip'
  image: python:3.12-alpine
  before_script:
    - apk add git
    - pip3 install -e .[dev]
  script:
    ruff check saltbox_gateway # --select I --fix
  cache:
    paths:
      - '.cache/pip/'

mypy:
  stage: lint
  variables:
    PIP_CACHE_DIR: '$CI_PROJECT_DIR/.cache/pip'
  image: python:3.12-alpine
  before_script:
    - apk add git
    - pip3 install -e .[dev]
  script:
    mypy saltbox_gateway
  cache:
    paths:
      - '.cache/pip/'
