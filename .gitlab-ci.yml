---

stages:
  - lint

ruff:
  stage: lint
  variables:
    PIP_CACHE_DIR: '$CI_PROJECT_DIR/.cache/pip'
  image: python:3.12-alpine
  before_script:
    - apk add git
    - pip3 install -e .[dev]
  script:
    ruff check saltbox_gateway # --select I --fix
  cache:
    paths:
      - '.cache/pip/'

mypy:
  stage: lint
  variables:
    PIP_CACHE_DIR: '$CI_PROJECT_DIR/.cache/pip'
  image: python:3.12-alpine
  before_script:
    - apk add git
    - pip3 install -e .[dev]
  script:
    mypy saltbox_gateway
  cache:
    paths:
      - '.cache/pip/'
